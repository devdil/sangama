[package]
name = "sangama"
version = "0.1.0"
edition = "2024"
description = "A measurable Rust foundation for distributed model execution"
publish = false

[dependencies]
serde_bytes = "0.11"
sangama-network-auth = { path = "crates/network-auth" }
sangama-llama-stage = { path = "crates/llama-stage", optional = true }
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
candle = { package = "candle-core", version = "=0.11.0" }
candle-nn = "=0.11.0"
candle-transformers = "=0.11.0"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
sha2 = "0.10"
subtle = "2.6"
libc = "0.2"
libp2p = { version = "0.56", default-features = false, features = ["tokio", "tcp", "noise", "yamux", "kad", "macros", "identify", "relay", "dcutr", "autonat", "request-response", "cbor"] }
futures = "0.3"
fs2 = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }

[features]
default = []
metal = ["candle/metal", "candle-nn/metal", "candle-transformers/metal"]
cuda = ["candle/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
# llama.cpp engine; needs scripts/fetch-llama-cpp.sh and CMake. Pick at most one GPU backend.
llamacpp = ["dep:sangama-llama-stage"]
llamacpp-metal = ["llamacpp", "sangama-llama-stage/metal"]
llamacpp-cuda = ["llamacpp", "sangama-llama-stage/cuda"]
llamacpp-vulkan = ["llamacpp", "sangama-llama-stage/vulkan"]
llamacpp-hip = ["llamacpp", "sangama-llama-stage/hip"]

[profile.release]
lto = "thin"

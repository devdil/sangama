[package]
name = "sangama-portal"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
argon2 = "0.5"
subtle = "2.6"
sangama-network-auth = { path = "../crates/network-auth" }
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
